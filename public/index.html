<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6b2f">
  <title>Kisan AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">🌾</span>
      <div>
        <h1>Kisan AI</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <select id="ui-lang" aria-label="Language"></select>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="climate" aria-selected="true" data-i18n="tab_climate"></button>
    <button role="tab" data-tab="plan" aria-selected="false" data-i18n="tab_plan"></button>
    <button role="tab" data-tab="ask" aria-selected="false" data-i18n="tab_ask"></button>
  </nav>

  <main>
    <section class="card" id="location-card">
      <h2 data-i18n="location"></h2>
      <div class="row">
        <button id="gps" class="secondary" data-i18n="use_gps"></button>
        <label class="grow"><span data-i18n="or_pick"></span>
          <select id="preset">
            <option value="">—</option>
            <option value="28.55,76.90">Najafgarh, Delhi</option>
            <option value="26.75,80.80">Near Lucknow, Uttar Pradesh</option>
            <option value="30.85,75.70">Near Ludhiana, Punjab</option>
            <option value="21.05,79.20">Near Nagpur, Maharashtra</option>
            <option value="17.25,78.35">Near Hyderabad, Telangana</option>
            <option value="13.10,77.45">Near Bengaluru, Karnataka</option>
            <option value="10.85,78.80">Cauvery delta, Tamil Nadu</option>
            <option value="22.70,88.10">Hooghly, West Bengal</option>
            <option value="26.85,75.60">Near Jaipur, Rajasthan</option>
            <option value="25.50,85.25">Near Patna, Bihar</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label><span data-i18n="lat"></span><input id="lat" type="number" step="0.01" min="-90" max="90" inputmode="decimal"></label>
        <label><span data-i18n="lon"></span><input id="lon" type="number" step="0.01" min="-180" max="180" inputmode="decimal"></label>
        <button id="load" data-i18n="load"></button>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <section id="tab-climate" class="tab-panel">
      <p id="field-status" class="status"></p>
      <div class="card" id="week-card" hidden>
        <h2 data-i18n="field_week"></h2>
        <div id="week"></div>
        <p class="source" data-i18n="adv_source"></p>
      </div>
      <div class="card" id="ndvi-card" hidden>
        <h2 data-i18n="field_ndvi"></h2>
        <div id="ndvi"></div>
        <p class="source" data-i18n="ndvi_source"></p>
      </div>
      <div class="card" id="soil-card" hidden>
        <h2 data-i18n="field_soil"></h2>
        <div id="soil"></div>
        <p class="source" data-i18n="soil_source"></p>
      </div>
      <div class="card" id="climate-out" hidden>
        <div id="chart" class="chart"></div>
        <div id="seasons" class="seasons"></div>
        <h3 data-i18n="insights"></h3>
        <ul id="insights" class="insights"></ul>
        <p class="source" data-i18n="source"></p>
      </div>
    </section>

    <section id="tab-plan" class="tab-panel" hidden>
      <div class="card">
        <div class="row">
          <label class="grow"><span data-i18n="irrigation"></span>
            <select id="irrigation">
              <option value="rainfed" data-i18n="irr_rainfed"></option>
              <option value="limited" data-i18n="irr_limited" selected></option>
              <option value="full" data-i18n="irr_full"></option>
            </select>
          </label>
          <label class="grow"><span data-i18n="last_crop"></span>
            <select id="last-crop"></select>
          </label>
        </div>
        <fieldset class="priorities">
          <legend data-i18n="priority"></legend>
          <label><input type="radio" name="priority" value="balanced" checked> <span data-i18n="pr_balanced"></span></label>
          <label><input type="radio" name="priority" value="income"> <span data-i18n="pr_income"></span></label>
          <label><input type="radio" name="priority" value="soil"> <span data-i18n="pr_soil"></span></label>
          <label><input type="radio" name="priority" value="water"> <span data-i18n="pr_water"></span></label>
        </fieldset>
        <fieldset class="constraints">
          <legend data-i18n="con_title"></legend>
          <label><input type="checkbox" id="low-labour"> <span data-i18n="con_low_labour"></span></label>
          <label><input type="checkbox" id="need-fodder"> <span data-i18n="con_fodder"></span></label>
          <details class="avoid">
            <summary data-i18n="con_avoid"></summary>
            <div id="avoid-list" class="avoid-list"></div>
          </details>
        </fieldset>
        <details class="scenario" id="scenario">
          <summary data-i18n="sc_title"></summary>
          <label><span id="sc-rain-label"></span><input type="range" id="sc-rain" min="-40" max="40" step="10" value="0"></label>
          <label><span id="sc-temp-label"></span><input type="range" id="sc-temp" min="-1" max="4" step="0.5" value="0"></label>
          <p class="hint" data-i18n="sc_note"></p>
        </details>
        <button id="make-plan" data-i18n="make_plan"></button>
      </div>
      <div id="plans"></div>
      <div class="card" id="compare-card" hidden>
        <h2 data-i18n="cmp_title"></h2>
        <p class="hint" data-i18n="cmp_help"></p>
        <div id="compare"></div>
      </div>
      <p class="judgment" id="plan-judgment" hidden>🧑‍🌾 <span data-i18n="judgment_plan"></span></p>
      <div class="card" id="mandi-card" hidden>
        <h2 data-i18n="mandi_title"></h2>
        <div id="mandi"></div>
        <p class="source" data-i18n="mandi_source"></p>
      </div>
    </section>

    <section id="tab-ask" class="tab-panel" hidden>
      <div class="card">
        <h2 data-i18n="ask_title"></h2>
        <p class="hint" data-i18n="ask_hint"></p>
        <div id="chat" class="chat" aria-live="polite"></div>
        <label><span data-i18n="ask_lang"></span><select id="ask-lang"></select></label>
        <form id="ask-form" class="ask-form">
          <textarea id="question" rows="3" maxlength="1500" required></textarea>
          <div class="row">
            <button type="button" id="mic" class="secondary" data-i18n="ask_mic" hidden></button>
            <button type="submit" id="ask-send" data-i18n="ask_send"></button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="foot">NASA Space Apps Challenge 2026 · Data: NASA POWER · NASA MODIS · ISRIC SoilGrids · Open-Meteo · data.gov.in</footer>
  <script type="module" src="app.js"></script>
</body>
</html>
